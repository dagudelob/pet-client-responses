[project]
name = "pet-client-responses"
version = "0.1.0"
description = "Panel interactivo y motor de respuestas 5 estrellas para clientes de Rover con MCP e IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

